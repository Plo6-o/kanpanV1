    var srcs=[]; r.branches.forEach(function(b){ if(srcs.indexOf(b[2])<0) srcs.push(b[2]); });
    srcs.sort(); r.src=srcs;
    r.srcdesc=(srcs.length===1)?(srcs[0]==='H'?'🟢跟外围共振(国外绳)':(srcs[0]==='C'?'🔵纯内需(国内电)':(srcs[0]==='M'?'🟡半全球化':'⚪混合'))):'⚪混合';
    var ch=[]; r.branches.forEach(function(b){ var s=b[0]+'·'+b[1]; if(ch.indexOf(s)<0) ch.push(s); });
    ch.sort(); r.chain=ch;
    var q=roleOf(r); r.role=q[0]; r.rolec=q[1]; r.roled=q[2];
    r.branches.forEach(function(b){ var kk=b[0]+'|'+b[1]+'|'+b[2];
      if(!bg[kk]) bg[kk]=[]; if(bg[kk].indexOf(r)<0) bg[kk].push(r); });
    r.tags.forEach(function(t){ if(!tg[t]) tg[t]=[]; tg[t].push(r); });
  });
  Object.keys(bg).forEach(function(kk){
    var parts=kk.split('|');
    bg[kk].forEach(function(r){
      var seen={};
      r.branches.forEach(function(b){
        var k2=parts[0]+'|'+parts[1]+'|'+parts[2];
        r.tags.forEach(function(t){
          var key=k2+'@'+t; if(seen[key])return; seen[key]=1;
          if(!TS[key]) TS[key]=[0,0];
          TS[key][0]+=(r.lbc>=2?1:0); TS[key][1]=Math.max(TS[key][1],r.lbc);
        });
      });
    });
  });
  function coreTags(r){
    if(!r.branches.length) return [];
    var b=r.branches[0], kk=b[0]+'|'+b[1]+'|'+b[2], out=[];
    r.tags.forEach(function(t){ var st=TS[kk+'@'+t]; if(st&&st[1]>=2) out.push(t); });
    return out;
  }
  function relation(A,B){
    var ca=coreTags(A), bt=B.tags;
    var sc=ca.filter(function(t){return bt.indexOf(t)>=0;}), det=[];
    var s1=0;
    if(ca.length&&sc.length){ s1=45*sc.length/ca.length; det.push(['跟随内核 '+sc.join('、'),Math.round(s1)]); }
    var ba={},bb={};
    A.branches.forEach(function(b){ba[b[0]+'·'+b[1]]=1;});
    B.branches.forEach(function(b){bb[b[0]+'·'+b[1]]=1;});
    var same=Object.keys(ba).filter(function(x){return bb[x];});
    var s2=same.length?25:0;
    if(s2) det.push(['同分支 '+same.join('、'),25]);
    var s3=(A.src.length===1&&A.src[0]!=='Q'&&A.src.join()===B.src.join())?15:0;
    if(s3) det.push(['同需求来源',15]);
    var s4=0,n4=[],gap=A.lbc-B.lbc;
    if(B.lbc===1){s4+=15;n4.push('后排首板·位置有空间');}
    else if(gap>=2){s4+=10;n4.push('低于龙头'+gap+'板');}
    else if(gap>=1){s4+=5;n4.push('低'+gap+'板');}
    else {s4-=10;n4.push('已与龙头同高度');}
    if(B.open_num>=3||B.turn>=25){s4-=15;n4.push('已爆量/炸板多·位置偏高');}
    if(B.fund>=1.5){s4+=5;n4.push('封单'+B.fund.toFixed(1)+'亿·资金坚决');}
    if(B.ltype==='一字板'){s4-=12;n4.push('一字板·买不到');}
    s4=Math.max(-25,Math.min(25,s4));
    if(n4.length) det.push(['位置/分歧 '+n4.join('、'),s4]);
    return [Math.max(0,Math.min(100,Math.round(s1+s2+s3+s4))),det];
  }
  function cnt(g){ return g.filter(function(x){return x.lbc>=2;}).length; }
  var anchors=[];
  rows.filter(function(r){return r.lbc>=3;}).sort(function(a,b){return b.lbc-a.lbc;}).forEach(function(A){
    var cl=[];

    cl.sort(function(x,y){return (y.score-x.score)||(y.lbc-x.lbc)||(y.fund-x.fund);});
    anchors.push({code:A.code,name:A.name,lbc:A.lbc,high:A.high,ltype:A.ltype,reason:A.reason,chain:A.chain,
      src:A.srcdesc,fund:A.fund,open_num:A.open_num,turn:A.turn,role:A.role,core:coreTags(A).sort(),
      rel:{strong:cl.filter(function(x){return x.score>=60;}),
           spread:cl.filter(function(x){return x.score>=35&&x.score<60;}),
           weak:cl.filter(function(x){return x.score<35;})}});
  });
  var tl=[];
  Object.keys(bg).sort(function(a,b){ return cnt(bg[b])-cnt(bg[a]); }).forEach(function(kk){
    var g=bg[kk]; if(g.length<3) return;
    var parts=kk.split('|'), seen={}, seq=[];
    g.slice().sort(function(x,y){return x.fbt<y.fbt?-1:1;}).forEach(function(x){
      if(seen[x.code]) return; seen[x.code]=1;
      seq.push({t:x.fbt,n:x.name,c:x.code,lbc:x.lbc,lt:x.ltype,r:x.reason}); });
    tl.push({big:parts[0],br:parts[1],src:parts[2],n:g.length,seq:seq.slice(0,14)});
  });
  var chains=[];
  Object.keys(bg).forEach(function(kk){ var g=bg[kk]; if(g.length<2) return;
    var parts=kk.split('|');
    var lead=g.slice().sort(function(a,b){return (b.lbc-a.lbc)||(b.fund-a.fund);})[0];
    var ts=[]; g.forEach(function(x){x.tags.forEach(function(t){ if(ts.indexOf(t)<0) ts.push(t);});});
    ts.sort(function(a,b){ return (tg[b]?tg[b].length:0)-(tg[a]?tg[a].length:0);});
    chains.push({big:parts[0],br:parts[1],src:parts[2],n:g.length,lb:cnt(g),mx:lead.lbc,lead:lead.name,leadcode:lead.code,tags:ts.slice(0,6)});
  });
  chains.sort(function(a,b){return (b.lb-a.lb)||(b.n-a.n);});
  var lb={}, lt={};
  rows.forEach(function(r){ lb[r.lbc]=(lb[r.lbc]||0)+1; lt[r.ltype]=(lt[r.ltype]||0)+1; });
  return {rows:rows,anchors:anchors,timeline:tl,chains:chains,lbdist:lb,ltype:lt,
    mx:Math.max.apply(null,rows.map(function(r){return r.lbc;})),

    tzb:rows.filter(function(r){return r.ltype==='T字板';}).length,
    fund1:rows.filter(function(r){return r.fund>=1.0;}).length};
}

/* ===== T7 映射编辑 ===== */
function renderT7(){ renderEditor(); }
function renderEditor(){
  const tags={};R.forEach(r=>r.tags.forEach(t=>tags[t]=(tags[t]||0)+1));
  const all=Object.keys(tags).sort((a,b)=>tags[b]-tags[a]);
  const saved=JSON.parse(localStorage.getItem('ladder_map')||'{}');
  const rows=all.slice(0,120).map(t=>{
    const m=saved[t];
    return '<tr><td>'+t+'<br><span class="dim" style="font-size:10px">'+tags[t]+'家</span></td>'+
     '<td><input data-t="'+t+'" data-f="big" value="'+(m?m[0]:'')+'" placeholder="大类"></td>'+
     '<td><input data-t="'+t+'" data-f="br" value="'+(m?m[1]:'')+'" placeholder="分支"></td>'+
     '<td><select data-t="'+t+'" data-f="src"><option value="">—</option>'+
       '<option value="H"'+(m&&m[2]==='H'?' selected':'')+'>H 国外绳</option>'+
       '<option value="C"'+(m&&m[2]==='C'?' selected':'')+'>C 国内电</option>'+
       '<option value="M"'+(m&&m[2]==='M'?' selected':'')+'>M 半全球化</option></select></td></tr>';
  }).join('');
  document.getElementById('t7').innerHTML='<div class="card"><h3>🛠 题材 → 分支 映射编辑 <span class="n">存在本机 localStorage</span></h3>'+
   '<div class="foot">题材天天在变，固定词表一定过期。<b>在这里改，保存后刷新页面生效</b>。改完记得：把映射表发我一份，我同步进正式版（这样换设备/换浏览器也在）。</div>'+
   '<div class="tw"><table class="tbl" style="min-width:640px"><thead><tr><th>题材标签</th><th>大类</th><th>分支</th><th>需求来源</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap"><button class="btn pri" onclick="saveMap(this)">💾 保存映射</button>'+
   '<button class="btn" onclick="clearMap()">🗑 清空</button>'+
   '<button class="btn" onclick="exportMap()">⬇️ 导出 JSON</button></div>'+
   '<div class="foot wn" style="margin-top:9px"><b>提示：</b>大类和分支只要<b>一致</b>就行（用于聚合成链）；需求来源决定它能不能跟外围信号联动 —— 这是<b class=bad>防「买错链」的关键字段</b>，别留空。</div></div>';
}
function saveMap(btn){
  const map={};
  document.querySelectorAll('#t7 input,#t7 select').forEach(el=>{
    const t=el.dataset.t,f=el.dataset.f,v=el.value.trim();
    if(!map[t]) map[t]=['','',''];
    if(f==='big')map[t][0]=v; if(f==='br')map[t][1]=v; if(f==='src')map[t][2]=v;
  });
  localStorage.setItem('ladder_map',JSON.stringify(map));
  btn.textContent='✅ 已保存';setTimeout(()=>btn.textContent='💾 保存映射',1600);
}
function clearMap(){localStorage.removeItem('ladder_map');alert('已清空本地映射');renderEditor();}
function exportMap(){const m=localStorage.getItem('ladder_map')||'{}';const b=new Blob([m],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ladder_map.json';a.click();}
