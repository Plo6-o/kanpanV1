\u5fae\u77ed\u5267\uff09\uff1b\u4ebf\u5609\u548c\uff08\u4eba\u5f62\u673a\u5668\u4eba+\u534e\u4e3a\u4e91\u5408\u4f5c+\u7535\u529b\u673a\u5668\u4eba\uff0c\u5c010.54\u70b80\u63622\uff09\u3002\u9009\u62e9\u660e\u65e5\u6700\u8be5\u76ef\uff1a\u9700\u8981\u9009\u6838\u5fc3/\u63a5\u529b/\u8865\u6da8\u3002\u8003\u8651\u9f99\u5934\u5173\u7cfb\uff1a\u4e2d\u4eac\u7535\u5b50\u662f4\u677f\u4e00\u5b57\uff0c\u9898\u6750\u6700\u786c\uff08HDI+\u7b97\u529b+\u5149\u6a21\u5757PCB+\u4eba\u5f62\u673a\u5668\u4eba\uff09\uff0c\u5c01\u53551.97\u4ebf\uff0c\u70b80\uff0c\u6362\u624b9\uff0c\u4f46\u4e00\u5b57\u677f\u4e70\u4e0d\u5230\uff1b\u660e\u65e5\u82e5\u5f00\u677f\u6362\u624b\u662f\u6838\u5fc3\u3002\u957f\u534e\u96c6\u56e2\u662f3\u677f\u4e00\u5b57\uff0c\u673a\u5668\u4eba\u4e1d\u6760\u6838\u5fc3\uff0c\u5c01\u53550.88\uff0c\u70b80\uff0c\u6362\u624b1\uff0c\u4e70\u4e0d\u5230\uff1b\u514b\u6765\u673a\u75353\u677f\u4e00\u5b57\uff0c\u5c01\u53553.35\u6700\u9ad8\uff0c\u5de5\u4e1a\u673a\u5668\u4eba+AI\uff0c\u6362\u624b1\uff0c\u5f3a\u3002\u4e5d\u9633\u80a1\u4efd4\u677f\u6362\u624b\uff0c\u5c01\u53553.17\u4ebf\uff0c\u70b81\uff0c\u6362\u624b4\uff0c\u9898\u6750\u673a\u5668\u4eba\u6295\u8d44+\u5c0f\u5bb6\u7535+\u7f8a\u5b57\u8f88\uff0c\u5c01\u5355\u5f88\u5927\uff0c\u53ef\u80fd\u662f\u60c5\u7eea\u6807\u6746\u3002\u5168\u7b51\u80a1\u4efd4\u677f\u6362\u624b\uff0c\u5c01\u53550.31\u5f31\uff0c\u70b80\uff0c\u6362\u624b10\uff0c\u9898\u6750\u8fb9\u7f18AI\u7b97\u529b+\u667a\u6167\u5efa\u7b51\uff0c\u5c01\u5355\u5f31\uff0c\u9ad8\u4f4d\u98ce\u9669\u3002\u660e\u65e5\u6700\u8be5\u76ef\u53ef\u80fd\uff1a\u4e2d\u4eac\u7535\u5b50\uff08\u9f99\u5934/\u7b97\u529b+\u673a\u5668\u4eba+PCB\uff0c\u4e00\u5b574\u677f\uff0c\u5f00\u677f\u627f\u63a5\u51b3\u5b9a\u60c5\u7eea\uff09\uff1b\u957f\u534e\u96c6\u56e2\uff08\u673a\u5668\u4eba\u4e1d\u6760\uff0c3\u677f\u4e00\u5b57\uff0c\u6838\u5fc3\u96f6\u90e8\u4ef6\uff0c\u5361\u4f4d\u4e2d\u4eac/\u514b\u6765\uff09\uff1b\u798f\u83b1\u65b0\u6750\uff082\u677f\u67d4\u6027\u4f20\u611f+\u6570\u636e\u91c7\u96c6\        high:String(r.high_days||'首板'),lbc:mm?+mm[1]:1,open_num:r.open_num||0,
       fund:+((r.order_amount||0)/1e8).toFixed(3),fbt:t('first_limit_up_time'),lbt:t('last_limit_up_time'),
       turn:+(r.turnover_rate||0).toFixed(2),reason:r.reason_type||'',tags:(r.reason_type||'').split('+').filter(Boolean)};});
   window.__NEWROWS=rows; done++; rebuild(); toast('✅ 已刷新：行情 + 涨停池 '+ZT+'家');
 }).catch(function(e){ done++;
   var local=(location.protocol==='file:')||(location.hostname==='localhost')||(location.hostname==='127.0.0.1');
   if(local) toast('⚠️ 浏览器禁止本地页面跨域取涨停池 → 部署到 GitHub Pages 后即可一键刷新（行情已刷新）');
   else toast('⚠️ 涨停池刷新失败（网络/限流），行情已刷新'); });
 setTimeout(function(){ if(done<2){} btn.innerHTML='⟳ 一键刷新'; },4000);
}
function fmtDate(){const d=new Date();const p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}
function rebuild(){
 if(!window.__NEWROWS) return;
 R=window.__NEWROWS;
 // 重新算角色/链
 R.forEach(function(r){ r.role=window.__role(r); r.rolec=window.__rc(r); });
 renderT1();renderT2();renderT3();renderT5();
}
/* ============ 启动 ============ */
renderT1();renderT2();renderT3();renderT4();renderT5();renderT6();renderT7();
setInterval(function(){var e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});},1000);
</script>
